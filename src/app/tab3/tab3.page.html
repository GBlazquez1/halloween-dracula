<ion-header>
  <ion-toolbar>
    <ion-title>Galería - Drácula</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h1>El rincón del terror</h1>

  <p class="presentacion">
    Un recorrido por las sombras del conde.
  </p>

  <div class="galeria">
    <figure>
      <img
        src="assets/dracula.jpg"
        alt="Representación del conde Drácula">

      <figcaption>
        <h2>El conde</h2>
        <p>Su mirada te ha elegido...</p>
      </figcaption>
    </figure>

    <figure>
      <img
        src="assets/castillo.jpg"
        alt="Castillo oscuro de ambientación de terror">

      <figcaption>
        <h2>El castillo</h2>
        <p>Las puertas se abren. Nadie promete que puedas salir.</p>
      </figcaption>
    </figure>

    <figure>
      <img
        src="assets/murcielagos.jpg"
        alt="Murciélagos en una escena nocturna">

      <figcaption>
        <h2>Las alas de la noche</h2>
        <p>Si escuchas sus alas, ya es demasiado tarde...</p>
      </figcaption>
    </figure>
  </div>
</ion-content>
